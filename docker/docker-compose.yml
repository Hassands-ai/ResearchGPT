services:
  postgres:
    image: postgres:16-alpine
    container_name: paperaxiom-postgres
    environment:
      POSTGRES_USER: paperaxiom
      POSTGRES_PASSWORD: paperaxiom_secret
      POSTGRES_DB: paperaxiom
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperaxiom"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: paperaxiom-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:latest
    container_name: paperaxiom-minio
    environment:
      MINIO_ROOT_USER: paperaxiom
      MINIO_ROOT_PASSWORD: paperaxiom_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  redis:
    image: redis:7-alpine
    container_name: paperaxiom-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
  redis_data:
