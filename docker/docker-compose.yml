services:

  # ==========================================================
  # ResearchGPT Backend
  # ==========================================================
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile

    container_name: researchgpt-backend

    env_file:
      - ../backend/.env

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333

      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: paperaxiom
      MINIO_SECRET_KEY: paperaxiom_secret
      MINIO_BUCKET: papers

      REDIS_HOST: redis
      REDIS_PORT: 6379

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
      redis:
        condition: service_started

    restart: unless-stopped


  # ==========================================================
  # PostgreSQL
  # ==========================================================
  postgres:
    image: postgres:16-alpine
    container_name: researchgpt-postgres

    environment:
      POSTGRES_USER: paperaxiom
      POSTGRES_PASSWORD: paperaxiom_secret
      POSTGRES_DB: paperaxiom

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U paperaxiom -d paperaxiom"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped


  # ==========================================================
  # Qdrant
  # ==========================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: researchgpt-qdrant

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    restart: unless-stopped


  # ==========================================================
  # MinIO
  # ==========================================================
  minio:
    image: minio/minio:latest
    container_name: researchgpt-minio

    environment:
      MINIO_ROOT_USER: paperaxiom
      MINIO_ROOT_PASSWORD: paperaxiom_secret

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    restart: unless-stopped


  # ==========================================================
  # Redis
  # ==========================================================
  redis:
    image: redis:7-alpine
    container_name: researchgpt-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    restart: unless-stopped


# ============================================================
# Persistent volumes
# ============================================================

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
  redis_data: