<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PaperAxiom – Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
    <!-- Logo -->
    <div class="flex items-center gap-3 mb-8 justify-center">
      <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
        </svg>
      </div>
      <div>
        <h1 class="text-xl font-bold text-slate-800">PaperAxiom</h1>
        <p class="text-xs text-slate-500">AI Research Assistant</p>
      </div>
    </div>

    <h2 class="text-2xl font-semibold text-slate-800 mb-1 text-center">Welcome back</h2>
    <p class="text-slate-500 text-sm mb-6 text-center">Sign in to continue your research</p>

    <div id="error" class="hidden mb-4 p-3 bg-red-50 text-red-600 text-sm rounded-lg"></div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input type="email" id="email" required
          class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
          placeholder="you@example.com" value="hassan2@paperaxiom.com" />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input type="password" id="password" required
          class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
          placeholder="••••••••" value="test1234" />
      </div>

      <button type="submit" id="loginBtn"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl transition">
        Sign In
      </button>
    </form>

    <p class="text-center text-sm text-slate-500 mt-6">
      Don't have an account?
      <a href="#" id="showRegister" class="text-indigo-600 font-medium hover:underline">Register</a>
    </p>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("loginBtn");
      const error = document.getElementById("error");
      btn.textContent = "Signing in...";
      btn.disabled = true;
      error.classList.add("hidden");

      try {
        await login(
          document.getElementById("email").value,
          document.getElementById("password").value
        );
        window.location.href = "index.html";
      } catch (err) {
        error.textContent = err.message;
        error.classList.remove("hidden");
        btn.textContent = "Sign In";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
