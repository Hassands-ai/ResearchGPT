<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ResearchGPT – Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #f5f7fb;
            color: #172033;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-card {
            width: 100%;
            max-width: 390px;
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow:
                0 12px 35px rgba(15, 23, 42, 0.12);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            font-weight: 700;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 700;
        }

        .brand-subtitle {
            font-size: 12px;
            color: #667085;
            margin-top: 2px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 25px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #667085;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .message {
            display: none;
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .message.error {
            display: block;
            background: #fff0f0;
            color: #dc2626;
        }

        .message.success {
            display: block;
            background: #ecfdf3;
            color: #15803d;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            height: 48px;
            border: 1px solid #d9deea;
            border-radius: 9px;
            padding: 0 14px;
            font-size: 15px;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }

        input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, .12);
        }

        button {
            width: 100%;
            height: 48px;
            border: 0;
            border-radius: 9px;
            background: #4f46e5;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        button:disabled {
            opacity: .65;
            cursor: not-allowed;
        }

        .switch {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #667085;
        }

        .switch button {
            width: auto;
            height: auto;
            padding: 0;
            margin: 0;
            background: transparent;
            color: #4f46e5;
            font-size: 14px;
        }

        .switch button:hover {
            background: transparent;
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="auth-card">

    <div class="brand">
        <div class="brand-icon">✦</div>

        <div>
            <div class="brand-name">ResearchGPT</div>
            <div class="brand-subtitle">AI Research Assistant</div>
        </div>
    </div>

    <!-- LOGIN -->
    <section id="loginSection">

        <h1>Welcome back</h1>

        <div class="subtitle">
            Sign in to continue your research
        </div>

        <div id="loginMessage" class="message"></div>

        <form id="loginForm">

            <div class="form-group">
                <label for="loginEmail">Email</label>

                <input
                    id="loginEmail"
                    type="email"
                    autocomplete="email"
                    placeholder="you@example.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>

                <input
                    id="loginPassword"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" id="loginBtn">
                Sign In
            </button>

        </form>

        <div class="switch">
            Don't have an account?
            <button type="button" id="showRegister">
                Register
            </button>
        </div>

    </section>


    <!-- REGISTER -->
    <section id="registerSection" class="hidden">

        <h1>Create account</h1>

        <div class="subtitle">
            Start your research with ResearchGPT
        </div>

        <div id="registerMessage" class="message"></div>

        <form id="registerForm">

            <div class="form-group">
                <label for="registerName">
                    Full Name <span style="font-weight:400;color:#98a2b3;">(optional)</span>
                </label>

                <input
                    id="registerName"
                    type="text"
                    autocomplete="name"
                    placeholder="Your name"
                >
            </div>

            <div class="form-group">
                <label for="registerEmail">
                    Email
                </label>

                <input
                    id="registerEmail"
                    type="email"
                    autocomplete="email"
                    placeholder="you@example.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="registerPassword">
                    Password
                </label>

                <input
                    id="registerPassword"
                    type="password"
                    autocomplete="new-password"
                    minlength="6"
                    placeholder="Create a password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="registerPasswordConfirm">
                    Confirm Password
                </label>

                <input
                    id="registerPasswordConfirm"
                    type="password"
                    autocomplete="new-password"
                    minlength="6"
                    placeholder="Confirm your password"
                    required
                >
            </div>

            <button type="submit" id="registerBtn">
                Create Account
            </button>

        </form>

        <div class="switch">
            Already have an account?
            <button type="button" id="showLogin">
                Sign In
            </button>
        </div>

    </section>

</div>


<!-- IMPORTANT: API client -->
<script src="/js/api.js"></script>

<script>

(function () {

    const loginSection =
        document.getElementById("loginSection");

    const registerSection =
        document.getElementById("registerSection");


    const loginMessage =
        document.getElementById("loginMessage");

    const registerMessage =
        document.getElementById("registerMessage");


    function showMessage(element, message, type) {

        element.textContent = message;

        element.className =
            "message " + type;
    }


    function clearMessage(element) {

        element.textContent = "";

        element.className = "message";
    }


    function showRegisterPage() {

        clearMessage(loginMessage);

        clearMessage(registerMessage);

        loginSection.classList.add("hidden");

        registerSection.classList.remove("hidden");

        document
            .getElementById("registerName")
            .focus();
    }


    function showLoginPage() {

        clearMessage(loginMessage);

        clearMessage(registerMessage);

        registerSection.classList.add("hidden");

        loginSection.classList.remove("hidden");

        document
            .getElementById("loginEmail")
            .focus();
    }


    document
        .getElementById("showRegister")
        .addEventListener(
            "click",
            showRegisterPage
        );


    document
        .getElementById("showLogin")
        .addEventListener(
            "click",
            showLoginPage
        );


    // ==============================
    // LOGIN
    // ==============================

    document
        .getElementById("loginForm")
        .addEventListener("submit", async function (event) {

            event.preventDefault();

            const btn =
                document.getElementById("loginBtn");

            const email =
                document
                    .getElementById("loginEmail")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("loginPassword")
                    .value;


            clearMessage(loginMessage);

            btn.disabled = true;

            btn.textContent = "Signing in...";


            try {

                await login(
                    email,
                    password
                );


                showMessage(
                    loginMessage,
                    "Login successful. Opening ResearchGPT...",
                    "success"
                );


                // Give localStorage a moment to update.
                setTimeout(function () {

                    window.location.href = "/";

                }, 250);


            } catch (error) {

                console.error(
                    "Login error:",
                    error
                );


                showMessage(
                    loginMessage,
                    error.message ||
                    "Incorrect email or password.",
                    "error"
                );


                btn.disabled = false;

                btn.textContent = "Sign In";
            }

        });


    // ==============================
    // REGISTER
    // ==============================

    document
        .getElementById("registerForm")
        .addEventListener("submit", async function (event) {

            event.preventDefault();


            const btn =
                document.getElementById("registerBtn");


            const name =
                document
                    .getElementById("registerName")
                    .value
                    .trim();


            const email =
                document
                    .getElementById("registerEmail")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("registerPassword")
                    .value;


            const confirmPassword =
                document
                    .getElementById("registerPasswordConfirm")
                    .value;


            clearMessage(registerMessage);


            if (password.length < 6) {

                showMessage(
                    registerMessage,
                    "Password must contain at least 6 characters.",
                    "error"
                );

                return;
            }


            if (password !== confirmPassword) {

                showMessage(
                    registerMessage,
                    "Passwords do not match.",
                    "error"
                );

                return;
            }


            btn.disabled = true;

            btn.textContent = "Creating account...";


            try {

                // Create account
                await register(
                    email,
                    name || null,
                    password
                );


                // Immediately authenticate the new account.
                await login(
                    email,
                    password
                );


                showMessage(
                    registerMessage,
                    "Account created successfully. Opening ResearchGPT...",
                    "success"
                );


                setTimeout(function () {

                    window.location.href = "/";

                }, 250);


            } catch (error) {

                console.error(
                    "Registration error:",
                    error
                );


                showMessage(
                    registerMessage,
                    error.message ||
                    "Unable to create account.",
                    "error"
                );


                btn.disabled = false;

                btn.textContent = "Create Account";
            }

        });

})();

</script>

</body>
</html>
